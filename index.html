<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#71392e" />
    <meta name="description" content="Build a bingo card from Steam Workshop items." />
    <title>TF2 Workshop Bingo</title>
  </head>
  <body>
    <!-- Menu background, picked like TF2: a random scripts/ChapterBackgrounds.txt entry per launch, replaced by
         holiday art (tf_hud_mainmenuoverride.cpp) in the date windows from econ_holidays.cpp, in UTC. -->
    <script>
      {
        const pick = (list) => list[Math.floor(Math.random() * list.length)];
        const now = new Date();
        const date = (now.getUTCMonth() + 1) * 100 + now.getUTCDate();
        const day = 864e5;
        const moonCycle = 29.53 * day;
        const moonPhase = (((now - Date.UTC(2025, 9, 6)) % moonCycle) + moonCycle) % moonCycle;
        const holiday =
          date >= 1001 && date < 1108 ? pick(["title_team_halloween2011", "title_team_halloween2012", "title_team_halloween2013", "title_team_halloween2014", "title_team_halloween2015", "title_scream_fortress_2017"])
          : date >= 1201 || date < 108 ? pick(["background_xmas2020", "background_xmas2023"])
          : moonPhase < day || moonPhase > moonCycle - day ? "title_fullmoon"
          : null;
        // Holiday art is full color to the edges; a vignette in the page color mutes it toward the regular
        // backgrounds, which have their own sepia vignette, so it sits behind the UI instead of competing.
        document.body.style.backgroundImage = holiday
          ? `radial-gradient(ellipse, rgb(28 26 25 / 35%) 30%, rgb(28 26 25 / 80%)), url(ui/console/${holiday}.webp)`
          : `url(ui/console/background_${pick(["2fort", "gravelpit", "upward", "mvm"])}.webp)`;
      }
    </script>
    <div class="app-shell">
      <!-- Laid out like TF2's main menu (resource/ui/mainmenuoverride.res): the wordmark where TFLogoImage sits, titled
           panels under it like EventPromo and FriendsContainer, the card where the class art goes, and the action
           buttons in the footer strip (FooterLine, BackgroundFooter) like the Items and Store buttons. -->
      <div class="menu">
        <h1 class="wordmark"><small>TF2 Workshop</small> Bingo</h1>

        <section class="menu-panel" aria-labelledby="event-title">
          <header class="panel-title">
            <h2 id="event-title"></h2>
            <button class="tf-button small-button" id="archive-button" type="button" popovertarget="archive" title="Every card, grouped by event">
              <img src="ui/glyphs/items.png" alt="" />Archive
            </button>
          </header>
          <div class="poster-toggle" id="poster-toggle" role="group" aria-labelledby="event-title"></div>
        </section>

        <section class="menu-panel loadout" aria-labelledby="items-title">
          <header class="panel-title">
            <h2 id="items-title">Items</h2>
            <span class="count" id="item-count"></span>
            <button class="tf-button icon-button small-button" id="clear-button" type="button" aria-label="Clear board" title="Clear board">
              <img src="ui/glyphs/workshop_delete.png" alt="" />
            </button>
          </header>
          <form class="add-row" id="add-form">
            <input
              id="link-input"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="Paste Workshop links"
              aria-label="Steam Workshop links"
            />
            <button class="tf-button icon-button" type="submit" aria-label="Add" title="Add">
              <img src="ui/glyphs/create.png" alt="" />
            </button>
          </form>
          <p class="status" id="status" role="status" aria-live="polite"></p>
          <p class="empty-hint" id="empty-hint">Ctrl+V anywhere, or drop links on a square.</p>
          <ol class="item-list" id="item-list"></ol>
        </section>
      </div>

      <main class="board">
        <div class="poster-stage" id="poster-stage">
          <img id="poster-image" class="poster-image" alt="" draggable="false" />
          <div class="bingo-grid" id="bingo-grid" aria-label="Bingo squares"></div>
        </div>
      </main>

      <footer class="site-foot">
        <button class="tf-button menu-button" id="copy-button" type="button" disabled>
          <img src="ui/glyphs/markdown.svg" alt="" />Copy Markdown
        </button>
        <button class="tf-button menu-button" id="download-button" type="button" disabled>
          <img src="ui/glyphs/save.png" alt="" />Download PNG
        </button>
        <p>
          Bingo cards by <a href="https://steamcommunity.com/groups/PaintersWorkshop">TF2 Painter's Workshop</a>
          · Made by <a href="https://github.com/Rhgx">Rocks</a>
        </p>
        <button class="tf-button icon-button small-button" id="sound-button" type="button" aria-pressed="true" aria-label="Sound" title="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="speaker" d="M3 9h4l5-4.5v15L7 15H3z" />
            <path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9.5 9.5 0 0 1 0 13" />
            <path class="cross" d="M15.5 9l6 6m0-6l-6 6" />
          </svg>
        </button>
      </footer>

      <div class="archive-panel" id="archive" popover aria-label="Card archive"></div>
      <div class="item-tooltip" id="tooltip" role="tooltip" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
